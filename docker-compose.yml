## istructions to build the image ##
# export INSTALL_MSSQL=true
# export INSTALL_XDEBUG=true
# export INSTALL_ORACLE=true
# docker compose build

x-common-variables: &common-variables
    NEXT_ENV: ${NEXT_ENV:-production}
    NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    NEXT_INTERNAL_API_URL: ${NEXT_INTERNAL_API_URL:-http://slim}
    NEXTJS_HOST: ${NEXTJS_HOST:-portico_nextjs}
    SLIM_HOST: ${SLIM_HOST:-portico_api}
    REDIS_HOST: ${REDIS_HOST:-portico_redis}
    WEBSOCKET_HOST: ${WEBSOCKET_HOST:-portico_websocket}
    REDIS_PORT: 6379

volumes:
    logs:
        driver: local
    redis_data:
        driver: local
    vendor_data:
        driver: local
    node_modules_data:
        driver: local
    postgres_data:
        driver: local
services:
    slim:
        container_name: ${SLIM_HOST:-portico_api}
        hostname: ${SLIM_HOST:-portico_api}
        build:
            context: .
            dockerfile: Dockerfile
            network: ${SLIM_BUILD_NETWORK:-default}
            args:
                INSTALL_MSSQL: ${INSTALL_MSSQL:-false}
                INSTALL_XDEBUG: ${INSTALL_XDEBUG:-false}
                INSTALL_ORACLE: ${INSTALL_ORACLE:-false}
                http_proxy: ${http_proxy}
                https_proxy: ${https_proxy}
        working_dir: /var/www/html
        environment:
            <<: *common-variables
            docker: "true"
            ENABLE_ASYNC_CRON: "1"
            SCIM_TENANT_ID: ${SCIM_TENANT_ID:-}
            SCIM_BEARER_TOKEN: ${SCIM_BEARER_TOKEN:-}
            SCIM_PUBLIC_BASE_URL: ${SCIM_PUBLIC_BASE_URL:-}
            LANG: en_US.UTF-8
            LC_ALL: en_US.UTF-8
            LANGUAGE: en_US.UTF-8
        ports:
            - "8088:80"
        volumes:
            - .:/var/www/html
            - vendor_data:/var/www/html/vendor
            - node_modules_data:/var/www/html/node_modules
            - ./logs:/var/log/apache2
            - /var/local/:/var/local/
            # developement: store your files in '/var/local/phpgw/<domain>/tmp' and '/var/local/phpgw/<domain>/files'
        networks:
            - internal
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - redis

    imap-test:
        image: greenmail/standalone:2.1.2
        container_name: portico_imap_test
        profiles: [email-test]
        environment:
            GREENMAIL_OPTS: >-
                -Dgreenmail.setup.test.imap
                -Dgreenmail.setup.test.imaps
                -Dgreenmail.hostname=0.0.0.0
                -Dgreenmail.users=outlook-test:local-test-password@outlook.test
        ports:
            - "1143:3143"
            - "1993:3993"
        networks:
            - internal

#docker compose --profile email-test up -d imap-test-seed
    imap-test-seed:
        image: python:3.12-alpine
        profiles: [email-test]
        restart: "no"
        depends_on:
            imap-test:
                condition: service_started
                restart: true
        command: ["python3", "/fixtures/seed_mailbox.py", "--host", "imap-test", "--port", "3993", "--if-empty", "--wait-seconds", "60"]
        volumes:
            - ./tests/fixtures/imap:/fixtures:ro
        networks:
            - internal

    pop-test:
        image: greenmail/standalone:2.1.2
        container_name: portico_pop_test
        profiles: [email-test]
        environment:
            GREENMAIL_OPTS: >-
                -Dgreenmail.setup.test.pop3
                -Dgreenmail.setup.test.pop3s
                -Dgreenmail.setup.test.imaps
                -Dgreenmail.hostname=0.0.0.0
                -Dgreenmail.users=pop-test:local-test-password@pop.test
        ports:
            - "127.0.0.1:1110:3110"
            - "127.0.0.1:1995:3995"
        networks:
            - internal

    pop-test-seed:
        image: python:3.12-alpine
        profiles: [email-test]
        restart: "no"
        depends_on:
            pop-test:
                condition: service_started
                restart: true
        command: ["python3", "/fixtures/seed_mailbox.py", "--host", "pop-test", "--port", "3993", "--user", "pop-test", "--address", "pop-test@pop.test", "--if-empty", "--wait-seconds", "60"]
        volumes:
            - ./tests/fixtures/imap:/fixtures:ro
        networks:
            - internal

    websocket:
        container_name: ${WEBSOCKET_HOST:-portico_websocket}
        hostname: ${WEBSOCKET_HOST:-portico_websocket}
        restart: unless-stopped
        build:
            context: .
            dockerfile: Dockerfile.websocket
#       network: host  # corporate proxy allow-lists by source IP; bridge NAT gets dropped
            args:
                http_proxy: ${http_proxy}
                https_proxy: ${https_proxy}
        working_dir: /var/www/html
        environment:
            <<: *common-variables
            docker: "true"
            WSS_LOG_ENABLED: "true"
            WSS_DEBUG_LOG_ENABLED: "${WSS_DEBUG_LOG_ENABLED:-false}"
            WSS_LOG_TO_DOCKER: "true"
#        ports:
#            - "8080:8080"  # WebSocket port
        volumes:
            - .:/var/www/html
            - vendor_data:/var/www/html/vendor
            - ./logs:/var/log/websocket
        networks:
            - internal
        depends_on:
            - redis
            - slim

    redis:
        image: redis:alpine
        container_name: ${REDIS_HOST:-portico_redis}
        hostname: ${REDIS_HOST:-portico_redis}

        restart: unless-stopped
#        ports:
#            - "6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - internal
        command: redis-server --appendonly yes

    nextjs:
        hostname: ${NEXTJS_HOST:-portico_nextjs}
        container_name: ${NEXTJS_HOST:-portico_nextjs}
        build:
            dockerfile: ./src/modules/bookingfrontend/client/Dockerfile.nextjs
#       network: host  # corporate proxy allow-lists by source IP; bridge NAT gets dropped
            args:
                - NEXT_ENV=${NEXT_ENV:-production}
                - http_proxy=${http_proxy}
                - https_proxy=${https_proxy}
        environment:
            <<: *common-variables
        networks:
            - internal

    postgres:
        image: postgres:15.0
        profiles: ["db"]
        container_name: ${POSTGRES_HOST:-portico_postgres}
        hostname: ${POSTGRES_HOST:-portico_postgres}
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
            PGDATA: /data/postgres
        volumes:
            - postgres_data:/data/postgres
            - ./db_setup:/docker-entrypoint-initdb.d
        networks:
            - internal

networks:
    internal:
        name: portico_internal
#        external: true